name: Build ARM64 Mainline Kernel

on:
  workflow_dispatch:
    inputs:
      enable_lto:
        description: '启用 ThinLTO (Clang ThinLTO)'
        required: true
        type: boolean
        default: false
      thinlto_jobs:
        description: 'ThinLTO Parallel Jobs (Limit to 2-4 to avoid OOM)'
        required: false
        default: '2'
      kernel_repo:
        description: 'Linux 内核 Git 仓库地址'
        required: true
        default: 'https://github.com/DaDDevil/linux.git'
      kernel_branch:
        description: '内核分支或 Tag (如: master, linux-6.12.y, v6.13)'
        required: true
        default: 'waffle'
      defconfig_path:
        description: '自定义 defconfig 文件在仓库中的路径'
        required: true
        default: 'waffle_defconfig'
      clang_url:
        description: '自定义 Clang 压缩包直链 (留空则默认使用系统 apt 安装的 Clang)'
        required: false
        default: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-Linux-X64.tar.xz'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出当前工作流仓库
        uses: actions/checkout@v4

      - name: 配置编译环境与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd libzstd-dev git ccache
      
      - name: 启用 10GB Swap
        run: |
          # 1. 停用并删除系统已存在的默认 swapfile
          sudo swapoff -a || true
          sudo rm -f /swapfile

          # 2. 重新创建 10GB Swap
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          
      - name: 下载并配置自定义 Clang 工具链
        if: ${{ github.event.inputs.clang_url != '' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/custom-clang
          echo "正在下载自定义 Clang: ${{ github.event.inputs.clang_url }}"
          curl -sSL "${{ github.event.inputs.clang_url }}" -o clang-toolchain.tar.xz
          
          # 解压文件
          tar -xf clang-toolchain.tar.xz -C $GITHUB_WORKSPACE/custom-clang
          rm -f clang-toolchain.tar.xz
          
          # 自动定位 clang 所在的 bin 目录真实绝对路径（消除压缩包多层目录差异）
          CLANG_BIN=$(find $GITHUB_WORKSPACE/custom-clang -type f -name "clang-*" | head -n 1)
          if [ -z "$CLANG_BIN" ]; then
            echo "::error::未在解压文件中找到 clang 二进制文件！"
            exit 1
          fi
          
          CLANG_BIN_DIR=$(dirname "$CLANG_BIN")
          echo "识别到 Clang 真实路径: $CLANG_BIN_DIR"
          
          # 赋予执行权限并加入环境变量
          chmod +x "$CLANG_BIN_DIR"/*
          echo "$CLANG_BIN_DIR" >> $GITHUB_PATH

      - name: 验证当前使用的 Clang 版本
        run: |
          echo "=== 当前 Clang 路径与版本信息 ==="
          which clang
          clang --version
          which ld.lld
          ld.lld --version

      - name: 配置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: 拉取内核源码
        run: |
          git clone --depth=1 --branch ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_repo }} linux-src

      - name: 载入配置文件
        run: |
          mkdir -p linux-src/arch/arm64/configs/
          cp ${{ github.event.inputs.defconfig_path }} linux-src/arch/arm64/configs/custom_defconfig

      - name: Configure Kernel & LTO Settings
        run: |
          cd linux-src/
          # 1. 生成基础 defconfig
          make LLVM=1 ARCH=arm64 SUBARCH=arm64 defconfig custom_defconfig

          # 2. 根据 Action 输入参数开关 ThinLTO
          if [ "${{ inputs.enable_lto }}" = "true" ]; then
            echo "===> Enabling Clang ThinLTO..."
            ./scripts/config -e LTO_CLANG_THIN -d LTO_NONE -d LTO_CLANG_FULL
          else
            echo "===> Disabling LTO (Building with LTO_NONE)..."
            ./scripts/config -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL
          fi

          # 3. 刷新 Kconfig 依赖关系
          make ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 编译内核、设备树与驱动模块
        run: |
          EXTRA_LDFLAGS=""
          if [ "${{ inputs.enable_lto }}" = "true" ]; then
            EXTRA_LDFLAGS="KBUILD_LDFLAGS=--thinlto-jobs=${{ inputs.thinlto_jobs }}"
          fi
          
          cd linux-src
          export CCACHE_DIR=~/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 编译 Image、DTBs 与 Modules
          make -j$(nproc) $EXTRA_LDFLAGS Image modules qcom/sm8650-oneplus-waffle.dtb

          # 安装并打包驱动模块
          make modules_install INSTALL_MOD_PATH=../modules_out INSTALL_MOD_STRIP=1

      - name: 收集与压缩输出产物
        run: |
          mkdir -p out/dtb
          # 复制内核镜像
          cp linux-src/arch/arm64/boot/Image out/
          # 提取 SM8650 / OnePlus 12 相关的 DTB 文件
          find linux-src/arch/arm64/boot/dts/ -type f -name "*.dtb" -exec cp -v {} out/dtb/ \;
          # 压缩模块文件
          tar -czvf out/modules.tar.gz -C modules_out .
          # 保存编译产生的完整 .config 作为回溯依据
          cp linux-src/.config out/kernel_config.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12-Kernel-${{ github.event.inputs.kernel_branch }}
          path: out/*
